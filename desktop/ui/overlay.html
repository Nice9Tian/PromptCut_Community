<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PromptCut</title>
<style>
  /*
   * The background-mode floating window (appears when the editor is collapsed, see desktop/src-tauri/src/background.rs).
   * The whole window is transparent and borderless; the rounded card drawn here is all the user sees.
   *   Click: open the editor; press and drag: move it; right-click: the "Open editor / Close" menu (a native menu popped up by the shell).
   * In SKILL mode it additionally shows what the desktop app sessions are doing, and the picture of the "last action".
   */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none;
    cursor: default;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card {
    flex: 0 0 72px; height: 72px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    border-radius: 12px;
    background: rgba(24, 26, 34, 0.94);
    border: 1px solid rgba(0, 219, 219, 0.55);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    color: #e6edf6;
    cursor: pointer;
  }
  .card.is-skill { border-color: #00DBDB; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #56719b; flex: 0 0 auto;
  }
  .card.is-skill .dot { background: #00DBDB; }
  .card.is-busy .dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .text { min-width: 0; flex: 1 1 auto; }
  .title { font-size: 12px; font-weight: 600; color: #00DBDB; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub {
    font-size: 11px; color: #8da4c8; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hint { font-size: 10px; color: #56719b; margin-top: 1px; }

  /*
   * The "last action" preview (only in SKILL mode). The shell enlarges the window only after the first image arrives, so when there is no image
   * this block takes up no space at all. It contains no controls; it answers a single question: what the agent's last step turned out to look like.
   */
  .preview {
    display: none;
    flex-direction: column;
    gap: 4px;
    border-radius: 10px;
    background: rgba(24, 26, 34, 0.94);
    border: 1px solid rgba(0, 219, 219, 0.45);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    padding: 6px;
    overflow: hidden;
  }
  .preview.is-on { display: flex; }
  .preview img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    background: #000;
    border-radius: 6px;
    pointer-events: none;
  }
  .preview .cap {
    font-size: 10px; color: #8da4c8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .preview .cap b { color: #00DBDB; font-weight: 600; }
</style>
<script src="overlay-summary.js"></script>
</head>
<body>
  <div class="card" id="card" title="Click to open the editor, right-click to quit PromptCut" data-t-title>
    <div class="dot"></div>
    <div class="text">
      <div class="title" id="title" data-t>PromptCut is running in background mode</div>
      <div class="sub" id="sub" data-t>Editor is collapsed, Agent keeps working</div>
      <div class="hint" data-t>Click to open · right-click to quit</div>
    </div>
  </div>
  <div class="preview" id="preview" title="The AI's last timeline action, and the picture at that moment" data-t-title>
    <img id="preview-img" alt="Picture of the last action" data-t-alt>
    <div class="cap" id="preview-cap"></div>
  </div>

<script>
  // Static text follows the system display language, through the same table as the lines pushed by the shell
  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = window.pcOverlay.t(el.textContent); });
  document.querySelectorAll('[data-t-title]').forEach(function (el) { el.title = window.pcOverlay.t(el.title); });
  document.querySelectorAll('[data-t-alt]').forEach(function (el) { el.alt = window.pcOverlay.t(el.alt); });
  var T = window.__TAURI__;
  function emit(name) {
    if (T && T.event && T.event.emit) T.event.emit(name);
  }

  /*
   * Click to open, press and hold to drag. A borderless window has no title bar, so dragging is handed to the shell (startDragging);
   * It only counts as a drag once the pointer has moved more than a few pixels after pressing, and as a click only if it was not dragged on release, so a drag does not pop up the editor.
   * The whole card and the preview block both count (the preview block is part of the floating window too).
   */
  var DRAG_PX = 4;
  var press = null;
  document.body.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    press = { x: e.screenX, y: e.screenY, dragged: false };
  });
  document.body.addEventListener('pointermove', function (e) {
    if (!press || press.dragged) return;
    if (Math.abs(e.screenX - press.x) + Math.abs(e.screenY - press.y) < DRAG_PX) return;
    press.dragged = true;
    var w = T && T.window && T.window.getCurrentWindow && T.window.getCurrentWindow();
    if (w && w.startDragging) w.startDragging();
  });
  document.body.addEventListener('pointerup', function (e) {
    if (e.button !== 0 || !press) return;
    var clicked = !press.dragged;
    press = null;
    if (clicked) emit('pc-overlay-open');
  });
  // Right-click: the shell pops up a native menu (Open editor / Close). The browser's own right-click menu is not wanted.
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    press = null;
    emit('pc-overlay-menu');
  });

  function hhmmss(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    function p(n) { return String(n).padStart(2, '0'); }
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  if (T && T.event && T.event.listen) {
    // State pushed by the shell (pushed only when it changes)
    T.event.listen('pc-overlay-state', function (e) {
      var s = window.pcOverlay.summarize((e && e.payload) || {});
      document.getElementById('title').textContent = s.title;
      document.getElementById('sub').textContent = s.sub;
      var card = document.getElementById('card');
      card.classList.toggle('is-skill', s.skill);
      card.classList.toggle('is-busy', s.busy);
      // After leaving SKILL, the preview collapses (the shell shrinks the window height back)
      if (!s.skill) document.getElementById('preview').classList.remove('is-on');
    });

    // The "last action" preview image: pushed once only when the json's modification time changes, so no deduplication is needed here
    T.event.listen('pc-skill-preview', function (e) {
      var d = (e && e.payload) || {};
      if (!d.data_url) return;
      document.getElementById('preview-img').src = d.data_url;
      var c = window.pcOverlay.previewCaption(d, hhmmss);
      var cap = document.getElementById('preview-cap');
      cap.textContent = '';
      var b = document.createElement('b');
      b.textContent = window.pcOverlay.t('Last step');
      cap.appendChild(b);
      cap.appendChild(document.createTextNode(' ' + c.what + c.rest));
      document.getElementById('preview').classList.add('is-on');
    });
  }

  // Tell the shell the page is ready: the floating window is only built the first time it is collapsed, so it never received the state pushed earlier; make the shell push it again
  emit('pc-overlay-ready');
</script>
</body>
</html>
