# The license gate of cargo-deny. Run: cd desktop/src-tauri && cargo deny check licenses
#
# Why this file exists: without a config, cargo-deny's allow list is empty and even MIT is judged "not in
# the allowlist" and fails, which is why that line in the pre-distribution checklist was never ticked. Here the licenses "we have confirmed can ship with
# binary distributions" are written out one by one, so that adding a dependency later that brings in a new license fails on the spot instead of slipping in quietly.
#
# Fully audited on 2026-09-08 (Tauri 2.11 dependency tree, about 460 crates):
#   - **No GPL / AGPL / SSPL**;
#   - LGPL-2.1-or-later appears only in r-efi, which is `MIT OR Apache-2.0 OR LGPL-2.1-or-later`
#     pick any one of the three, and we take MIT; moreover it is a dependency of the wasi target and takes no part in compilation in the Windows package;
#   - MPL-2.0 appears in 4 crates (cssparser / cssparser-macros / dtoa-short / selectors /
#     option-ext); it is weak copyleft **counted per file**, so it may be statically linked into a closed-source binary, but users must be able to get
#     the source of those files: see the notes on obtaining the source in section 4 of THIRD-PARTY-LICENSES.md.

[licenses]
# When distributing binaries, these only require attribution / retaining notices, not opening up our own source code
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
    # Weak copyleft, counted per file: it is enough to provide a way to obtain the source with the package; it does not spread to our code
    "MPL-2.0",
]

# When a crate offers a choice among several licenses, prefer these (a larger number means higher priority).
# r-efi is MIT OR Apache-2.0 OR LGPL-2.1-or-later: make it land on MIT,
# instead of being judged as having brought in LGPL.
[[licenses.clarify]]
crate = "r-efi"
expression = "MIT OR Apache-2.0"
license-files = []

# promptcut itself has no license field (it is not published to crates.io; it is the application code of this repo).
# Private crates do not take part in license evaluation.
[licenses.private]
ignore = true
