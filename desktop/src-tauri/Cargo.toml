[package]
name = "promptcut"
version = "0.2.9"
edition = "2021"
authors = []
description = "PromptCut Desktop"
# This crate is the application code of this repo and is not published to crates.io. Only when this is declared does cargo-deny treat it as a private crate
# and skip license evaluation (see [licenses.private] in deny.toml); otherwise every check gets stuck on "the crate itself has no license"
publish = false

[lib]
name = "promptcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: multiple webviews in one window (the agent's browser is a child webview inside the main window, see agent_webview.rs)
# tray-icon: the tray icon for background mode (see background.rs)
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The "previous action" preview image below the SKILL floating window: the shell reads the png and pushes it to the floating page as a data URL
base64 = "0.22"

# Everything after this section is a **dependency that only exists on Windows**. Think it through before adding anything here:
# if a generic crate falls in here, non-Windows targets hit an unresolved import as soon as they compile, whereas this machine only ships
# Windows packages and cargo build passes anyway: a mistake would only surface once someone switches platform or CI adds a cross check.
#
# Muting the agent child webview requires calling WebView2's ICoreWebView2_8::IsMuted directly; Tauri does not wrap this layer.
# Keep the version consistent with what tauri 2.11 locks (see Cargo.lock), otherwise two copies of windows-rs appear and their types do not match.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# Win32_Graphics_Gdi: sample screen pixels to read the menu bar color (chrome_color.rs)
# Win32_System_JobObjects + Win32_System_Threading: tie the sidecar into a kill-on-close
# job object, so the kernel still reclaims its whole tree when the shell is force-killed (see src/kill_on_close.rs)
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
