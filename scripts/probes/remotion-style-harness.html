<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Render harness for the remotion-style framework probe</title>
<!--
  The render harness used by the probe scripts/probes/remotion-style-probe.mjs: a 1920×1080 frame into which a card's component is mounted and re-rendered at the t given by the probe.
  It does only these three things, "mount the card's Component, change t, unmount", with no stage, clock or prerender: what is being compared is what the card itself draws at different values of t.
  The card module is loaded through this workspace's dev server (a user card goes through the overlay layer and the transform hook of the card plugin, the same route the editor uses to load it).
-->
<style>
  html, body { margin: 0; background: #101418; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #101418; }
</style></head><body><div id="stage"></div>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import { flushSync } from "react-dom";

/** Catch errors thrown by the component and record them for the probe to read (so the whole page does not go blank) */
class Boundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error) { window.__rsError = { name: String(error?.name ?? ""), message: String(error?.message ?? error) }; }
  render() { return this.state.error ? null : this.props.children; }
}

const isCardDef = (v) => !!v && typeof v === "object" && typeof v.id === "string" && typeof v.Component === "function";
let root = null, def = null, params = null, mod = null;
const render = (t) => flushSync(() => root.render(React.createElement(Boundary, null, React.createElement(def.Component, { params, playToken: 0, t, duration: 10 }))));

window.__rs = {
  /** Load a card module and return a summary of the card definition it exports */
  async load(url) {
    mod = await import(/* @vite-ignore */ url);
    def = Object.values(mod).find(isCardDef) ?? null;
    if (!def) throw new Error(`${url} contains no card definition`);
    return { id: def.id, frameMode: def.frameMode, frozen: Object.isFrozen(def), defaultsFrozen: Object.isFrozen(def.defaults), componentFrozen: Object.isFrozen(def.Component), exports: Object.keys(mod) };
  },
  /** Mount: start from the t of this moment */
  mount(t, overrides = {}) {
    window.__rsError = null;
    params = { ...def.defaults, ...overrides };
    root = createRoot(document.getElementById("stage"));
    render(t);
  },
  /** Change t on the same mounted component (both sequential playback and jumping back and forth go through it) */
  set(t) { render(t); },
  unmount() { if (root) flushSync(() => root.unmount()); root = null; },
  error() { return window.__rsError ?? null; },
};
// ?css=1: bring in the editor's own styles (Tailwind etc.), so that cards written with Tailwind classes lay out correctly (used by the guide's blind-write acceptance script; remotion-style-probe does not pass it, as its cards all use inline styles)
if (new URLSearchParams(location.search).get("css") === "1") await import(/* @vite-ignore */ "/src/index.css");
window.__rsReady = true;
</script></body></html>
