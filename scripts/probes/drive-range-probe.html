<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Drive segmented byte fetch probe</title>
<!--
  Cloud drive connector D1 probe (task brief docs/plan/drive-connector-task.md, section 6).

  Verifies two things at once:
    1. Whether a file chosen in Google Picker can be read under the non-sensitive scope drive.file alone;
    2. Whether files.get?alt=media supports Range (the official docs do not say, so it can only be measured).

  How to run it (do not use the project's dev server, to avoid touching the one the user keeps running):
      cd <directory containing this file>
      python -m http.server 5321
    then open http://localhost:5321/drive-range-probe.html in a browser

  Google Cloud must be configured first (task brief, section 8): the authorized JavaScript origins must include
  http://localhost:5321, and the only scope to add is .../auth/drive.file.
-->
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --mut:#666; --line:#ddd; --ok:#0a7d32; --bad:#c0271d; --card:#f7f7f8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181a; --fg:#e8e8ea; --mut:#9a9aa0; --line:#34353a; --ok:#4ec76f; --bad:#ff6b5e; --card:#202126; }
  }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 system-ui,"Segoe UI","Microsoft YaHei",sans-serif; margin:0; padding:24px 16px; }
  main { max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--mut); margin:0 0 20px; }
  fieldset { border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin:0 0 16px; }
  legend { padding:0 6px; color:var(--mut); font-size:12px; }
  label { display:block; margin:10px 0 4px; font-size:12px; color:var(--mut); }
  input[type=text] { width:100%; box-sizing:border-box; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:13px ui-monospace,Consolas,monospace; }
  button { padding:8px 16px; border:0; border-radius:6px; background:#2d6cdf; color:#fff; font-size:14px; cursor:pointer; margin-right:8px; }
  button:disabled { opacity:.45; cursor:default; }
  #log { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; white-space:pre-wrap; word-break:break-all; font:12px/1.65 ui-monospace,Consolas,monospace; min-height:120px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .mut { color:var(--mut); }
</style>
</head>
<body>
<main>
  <h1>Drive segmented byte fetch probe</h1>
  <p class="sub">Verifies two things: whether <code>drive.file</code> is enough, and whether <code>files.get?alt=media</code> supports Range.</p>

  <fieldset>
    <legend>Three items from Google Cloud (none is a secret; they appear on the page)</legend>
    <label for="cid">OAuth client ID (<code>…apps.googleusercontent.com</code>)</label>
    <input type="text" id="cid" autocomplete="off" spellcheck="false">
    <label for="key">API key (needed by Picker)</label>
    <input type="text" id="key" autocomplete="off" spellcheck="false">
    <label for="app">Cloud project number (digits only, the Picker appId; the per-file authorization of <code>drive.file</code> is accounted against it)</label>
    <input type="text" id="app" autocomplete="off" spellcheck="false">
  </fieldset>

  <p>
    <button id="go" disabled>Authorize and pick a video</button>
    <button id="clear">Clear log</button>
  </p>

  <div id="log">Loading Google's scripts…</div>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<script>
const SCOPE = "https://www.googleapis.com/auth/drive.file";
const LS = "pc.drive-probe";
const logEl = document.getElementById("log");
const goEl = document.getElementById("go");
const fields = { cid: document.getElementById("cid"), key: document.getElementById("key"), app: document.getElementById("app") };

let lines = [];
function log(text, cls) {
  lines.push(cls ? `<span class="${cls}">${text}</span>` : text);
  logEl.innerHTML = lines.join("\n");
}
function reset() { lines = []; logEl.textContent = ""; }
document.getElementById("clear").onclick = reset;

// The three input boxes are remembered locally so they need not be refilled every time; they are not secrets
for (const [k, el] of Object.entries(fields)) {
  try { el.value = localStorage.getItem(`${LS}.${k}`) ?? ""; } catch {}
  el.addEventListener("input", () => { try { localStorage.setItem(`${LS}.${k}`, el.value.trim()); } catch {} });
}

// Let it through only once both scripts have arrived
let gisReady = false, pickerReady = false;
function maybeEnable() {
  if (!gisReady || !pickerReady) return;
  goEl.disabled = false;
  reset();
  log("Scripts loaded. Fill in the three items above, then click \"Authorize and pick a video\".", "mut");
}
const waitFor = (test, done) => {
  const t = setInterval(() => { if (test()) { clearInterval(t); done(); } }, 120);
  setTimeout(() => clearInterval(t), 20000);
};
waitFor(() => window.google?.accounts?.oauth2, () => { gisReady = true; maybeEnable(); });
waitFor(() => window.gapi, () => gapi.load("picker", () => { pickerReady = true; maybeEnable(); }));

goEl.onclick = () => {
  const cid = fields.cid.value.trim(), key = fields.key.value.trim(), app = fields.app.value.trim();
  if (!cid || !key || !app) { reset(); log("All three items are required.", "bad"); return; }
  reset();
  log("① Requesting authorization, the scope needed is only " + SCOPE);
  google.accounts.oauth2.initTokenClient({
    client_id: cid,
    scope: SCOPE,
    callback: (resp) => {
      if (resp.error) { log(`Authorization failed: ${resp.error} ${resp.error_description ?? ""}`, "bad"); return; }
      log(`   Got an access token, expires in about ${resp.expires_in} seconds (${(resp.expires_in / 60).toFixed(0)} minutes)`, "ok");
      log(`   Scope actually granted: ${resp.scope}`);
      openPicker(resp.access_token, key, app);
    },
  }).requestAccessToken();
};

function openPicker(token, key, appId) {
  log("② Opening Picker, pick a video file");
  new google.picker.PickerBuilder()
    .addView(new google.picker.DocsView(google.picker.ViewId.DOCS_VIDEOS).setIncludeFolders(true))
    .setOAuthToken(token)
    .setDeveloperKey(key)
    .setAppId(appId)
    .setCallback((data) => {
      if (data.action === google.picker.Action.CANCELLED) { log("   Cancelled.", "mut"); return; }
      if (data.action !== google.picker.Action.PICKED) return;
      const doc = data.docs[0];
      log(`   Selected: ${doc.name} (id ${doc.id})`, "ok");
      runChecks(token, doc.id);
    })
    .build()
    .setVisible(true);
}

const api = (id, qs) => `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?${qs}`;

async function runChecks(token, id) {
  const auth = { Authorization: `Bearer ${token}` };
  let size = null;

  // Question 1: under the narrow scope drive.file, can the file chosen in Picker have its metadata read
  log("③ Reading metadata with drive.file (verifying whether \"choosing equals authorizing\" holds)");
  try {
    const r = await fetch(api(id, "fields=id,name,size,mimeType&supportsAllDrives=true"), { headers: auth });
    const body = await r.json();
    if (!r.ok) { log(`   ✗ ${r.status} ${JSON.stringify(body?.error?.message ?? body)}`, "bad"); return; }
    size = Number(body.size);
    log(`   ✓ Read it: ${body.mimeType}, ${(size / 1e6).toFixed(1)} MB`, "ok");
    log("   → drive.file is enough, the restricted scope drive.readonly is not needed", "ok");
  } catch (e) { log(`   ✗ ${e}`, "bad"); return; }

  // Question 2: does alt=media support Range. File head
  log("④ Fetching the first 1024 bytes (Range: bytes=0-1023)");
  const head = await ranged(api(id, "alt=media&supportsAllDrives=true"), auth, "bytes=0-1023");
  if (!head) return;

  // Question 3: can the middle be fetched too? A 206 alone is not enough, we must confirm it really gives bytes by offset rather than from the start
  let mid = null;
  if (size && size > 4 * 1024 * 1024) {
    const from = Math.floor(size / 2), to = from + 1023;
    log(`⑤ Fetching 1024 bytes from the middle (Range: bytes=${from}-${to})`);
    mid = await ranged(api(id, "alt=media&supportsAllDrives=true"), auth, `bytes=${from}-${to}`);
  } else {
    log("⑤ File too small, skipping the middle check (rerunning with a file larger than 4 MB is more convincing)", "mut");
  }

  log("");
  if (head.status === 206 && head.bytes === 1024) {
    log("Conclusion: Drive supports Range, fetching bytes in segments works.", "ok");
    if (mid && mid.status === 206 && mid.bytes === 1024) {
      const same = head.sha === mid.sha;
      log(same
        ? "But the middle and the head have the same content, which is suspicious: it may not have given bytes by offset. Please try another file."
        : "The middle differs from the head, confirming the bytes were given by offset.", same ? "bad" : "ok");
    }
    log("→ Task brief D1 passed: the A3 short-lived ticket route can be designed around segmented fetching, and resumable transfer can work down to the chunk level.", "ok");
  } else {
    log(`Conclusion: did not get 206 (actual ${head.status}, received ${head.bytes} bytes).`, "bad");
    log("→ It can only be pulled as a whole file. The rule \"if unsupported, pull the whole file\" in section 9 of the task brief takes effect, and resumable transfer degrades to redoing the whole file.", "bad");
  }
}

async function ranged(url, auth, range) {
  try {
    const r = await fetch(url, { headers: { ...auth, Range: range } });
    if (r.status !== 206 && r.status !== 200) {
      log(`   ✗ ${r.status} ${(await r.text()).slice(0, 300)}`, "bad");
      return null;
    }
    const buf = new Uint8Array(await r.arrayBuffer());
    // Content-Range can only be read if the server exposes it via Access-Control-Expose-Headers; failing to read it does not count as a failure
    const cr = r.headers.get("Content-Range");
    const digest = await crypto.subtle.digest("SHA-256", buf);
    const sha = [...new Uint8Array(digest)].slice(0, 8).map((b) => b.toString(16).padStart(2, "0")).join("");
    log(`   Status ${r.status}${r.status === 206 ? " (Partial Content)" : " (whole file, Range ignored)"}, received ${buf.length} bytes`,
        r.status === 206 ? "ok" : "bad");
    log(`   Content-Range: ${cr ?? "(not exposed cross-origin, does not affect the judgment)"}`, "mut");
    log(`   sha256 of the first 8 bytes: ${sha}`, "mut");
    return { status: r.status, bytes: buf.length, sha };
  } catch (e) { log(`   ✗ ${e}`, "bad"); return null; }
}
</script>
</body>
</html>
