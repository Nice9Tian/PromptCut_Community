name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 这个项目的脚本按 Windows 写（PowerShell、windowsHide、本机 Chrome 路径），
    # 所以 CI 也在 Windows 上跑。Linux 没有验证过。
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 导出成片的测试要 ffmpeg 在 PATH 上
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Unit tests
        run: npm test
