name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The commercial edition inherits this code and carries this file along too; it does not run in private repositories.
    if: ${{ !github.event.repository.private }}
    # This project's scripts are written for Windows (PowerShell, windowsHide, local Chrome path),
    # So CI also runs on Windows. Linux has not been verified.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Tests that export the final video need ffmpeg on PATH
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Unit tests
        run: npm test
